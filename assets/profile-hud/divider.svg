<svg xmlns="http://www.w3.org/2000/svg" width="840" height="8" viewBox="0 0 840 8" role="img" aria-labelledby="t"><title id="t">Divider</title><style>.sans{font-family:'Space Grotesk', 'Inter', 'Segoe UI', system-ui, sans-serif}.mono{font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace}.streak{transform:translateX(340px);animation:slide 3.6s linear infinite}@keyframes slide{from{transform:translateX(-160px)}to{transform:translateX(840px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="streak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset=".5" stop-color="#2dd4bf" stop-opacity="1"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient></defs><line x1="0" y1="4.0" x2="840" y2="4.0" stroke="#1c2630" stroke-width="1"/><rect class="streak" x="0" y="3.25" width="160" height="1.5" fill="url(#streak)"/></svg>