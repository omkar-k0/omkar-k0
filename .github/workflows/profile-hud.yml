name: Profile cards

on:
  push:
    paths: [profile.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # omkar-k0/profile-hud v1.0.0
      - uses: omkar-k0/profile-hud@cb297cab3f34e3ee888de897316bc67b05e370e0
        with:
          config: profile.yml
          output-dir: assets/profile-hud
          commit: "true"
