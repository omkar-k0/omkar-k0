name: README cards

on:
  push:
    paths: [profile.yml]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the v1.1.3 commit so a later change upstream can't alter what runs here.
      - uses: Sagargupta16/readme-kit-action@1a702596980d42e7b54751af233c07a9218e8718
        with:
          commit: true
